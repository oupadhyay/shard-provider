[package]
name = "shard-provider"
version = "0.1.0"
description = "Host-free provider transports and wire contracts for Shard"
edition = "2021"
readme = "README.md"
repository = "https://github.com/oupadhyay/shard-provider"
publish = false

[dependencies]
base64 = "0.22"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shard-tool-api = { git = "https://github.com/oupadhyay/shard-tool-api", rev = "aea826a9e64b3035843aa8800f2f6c0f5fbe8b9a" }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
